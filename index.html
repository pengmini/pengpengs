<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 200px; font-size: 15px; }
    .memo button { float: right; }

    /* AI 코멘트 영역 */
    #aiBox {
      display: none;
      margin: 16px 0;
      padding: 14px 18px;
      background: #f0f7ff;
      border: 1px solid #cce5ff;
      border-radius: 8px;
      max-width: 600px;
    }
    #aiBox.show { display: block; }
    #aiBox h3 { margin: 0 0 8px 0; font-size: 15px; color: #0056b3; }
    #aiBox p { margin: 0; font-size: 14px; line-height: 1.6; color: #333; white-space: pre-wrap; }
    .ai-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-left: 10px;
    }
    .ai-btn:hover { background: #1557b0; }
    .ai-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- 백엔드 1: Firestore 실시간 저장 기능이 연결되었습니다 -->

  <!-- 백엔드 2: Google 로그인/로그아웃 및 사용자 정보 영역 -->
  <div id="userArea"></div>

  <div id="writer">
    <textarea id="input" rows="3" minlength="5" maxlength="50" placeholder="메모를 쓰고 엔터 (5자 이상 50자 이하)"></textarea>
  </div>

  <!-- AI 교사 코멘트 표시 영역 -->
  <div id="aiBox">
    <h3>🤖 AI 교사 도우미 코멘트</h3>
    <p id="aiText"></p>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
